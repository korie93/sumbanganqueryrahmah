<svg xmlns="http://www.w3.org/2000/svg" class="glyph in" viewBox="0 0 120 120" aria-hidden="true"><style><![CDATA[svg{--blue-on-black:#5b8cff;--blue-paper:#2a63f0;--gc:#2a63f0;--spring:cubic-bezier(.34,1.56,.64,1);--mono:ui-monospace,monospace}.glyph{--gc:var(--blue-on-black);width:58%;fill:none;stroke:var(--gc);stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.panel.light .glyph{--gc:var(--blue-paper)}
.glyph *{animation-play-state:paused}
.glyph.in *{animation-play-state:running}
.fig.boost .glyph *{animation-duration:2.1s!important}
.d{stroke-dasharray:1;animation:draw 1.3s cubic-bezier(.6,0,.2,1) both}
.d.l2{animation-delay:.75s}
@keyframes draw{from{stroke-dashoffset:1;opacity:0}2%{opacity:1}}
.dot{fill:var(--gc);stroke:none}
.sub-grid{stroke:var(--gc);stroke-width:.6;opacity:.14;stroke-dasharray:2 4}

/* Search: lens travels row to row, laser scans inside lens, row locks on */
.row{stroke-width:3.2;opacity:.25;transition:opacity .2s}
.row-sub{stroke-width:2;opacity:.16}
.row-hi{stroke-width:7;opacity:0}
.r1{opacity:1;animation:r1 6s 1.2s infinite}.r2{animation:r2 6s 1.2s infinite}.r3{animation:r3 6s 1.2s infinite}
.rh1{animation:rh1 6s 1.2s infinite}.rh2{animation:rh2 6s 1.2s infinite}.rh3{animation:rh3 6s 1.2s infinite}
@keyframes r1{0%,26%{opacity:1;stroke-width:3.8}32%,92%{opacity:.22;stroke-width:3}100%{opacity:1;stroke-width:3.8}}
@keyframes r2{0%,30%{opacity:.22;stroke-width:3}36%,60%{opacity:1;stroke-width:3.8}66%,100%{opacity:.22;stroke-width:3}}
@keyframes r3{0%,62%{opacity:.22;stroke-width:3}68%,88%{opacity:1;stroke-width:3.8}94%,100%{opacity:.22;stroke-width:3}}
@keyframes rh1{0%,26%{opacity:.35}32%,92%{opacity:0}100%{opacity:.35}}
@keyframes rh2{0%,30%{opacity:0}36%,60%{opacity:.35}66%,100%{opacity:0}}
@keyframes rh3{0%,62%{opacity:0}68%,88%{opacity:.35}94%,100%{opacity:0}}
.lens{animation:seek 6s 1.2s cubic-bezier(.65,0,.35,1) infinite}
.lens-ring{stroke-width:1;opacity:0;transform-box:fill-box;transform-origin:center;animation:lensPing 6s 1.2s ease-out infinite}
.lens-scan{stroke-width:1;opacity:.55;animation:lensScan 1.5s ease-in-out infinite alternate}
@keyframes lensScan{from{transform:translateY(-6px)}to{transform:translateY(6px)}}
@keyframes seek{
  0%,22%{transform:translate(0,0)}
  30%,54%{transform:translate(-6px,26px)}
  64%,86%{transform:translate(2px,52px)}
  100%{transform:translate(0,0)}
}
@keyframes lensPing{
  0%,5%{opacity:0;transform:scale(.85)}
  12%{opacity:.65;transform:scale(1.35)}
  24%,34%{opacity:0;transform:scale(1.6)}
  40%{opacity:.65;transform:scale(1.35)}
  54%,66%{opacity:0;transform:scale(1.6)}
  72%{opacity:.65;transform:scale(1.35)}
  86%,100%{opacity:0;transform:scale(1.6)}
}

/* Analyse: bars rise with spring, area glows, trend line draws, nodes pulse */
.bar{transform-box:fill-box;transform-origin:50% 100%;fill:var(--gc);fill-opacity:.14;vector-effect:non-scaling-stroke;stroke-width:2px}
.b1{animation:b1 6.5s infinite}.b2{animation:b2 6.5s infinite}.b3{animation:b3 6.5s infinite}
@keyframes b1{0%{transform:scaleY(0);animation-timing-function:var(--spring)}12%,84%{transform:scaleY(1);animation-timing-function:cubic-bezier(.5,0,.75,0)}93%,100%{transform:scaleY(0)}}
@keyframes b2{0%,5%{transform:scaleY(0);animation-timing-function:var(--spring)}17%,84%{transform:scaleY(1);animation-timing-function:cubic-bezier(.5,0,.75,0)}93%,100%{transform:scaleY(0)}}
@keyframes b3{0%,10%{transform:scaleY(0);animation-timing-function:var(--spring)}22%,84%{transform:scaleY(1);animation-timing-function:cubic-bezier(.5,0,.75,0)}93%,100%{transform:scaleY(0)}}
.trend{stroke-width:2.2;stroke-linecap:butt;stroke-dasharray:1;animation:trend 6.5s infinite}
@keyframes trend{0%,22%{stroke-dashoffset:1;animation-timing-function:cubic-bezier(.4,0,.2,1)}46%,84%{stroke-dashoffset:0;animation-timing-function:cubic-bezier(.5,0,.75,0)}92%,100%{stroke-dashoffset:1}}
.tip{transform-box:fill-box;transform-origin:center}
.t1{animation:t1 6.5s infinite}.t2{animation:t2 6.5s infinite}.t3{animation:t3 6.5s infinite}
@keyframes t1{0%,20%{opacity:0;transform:scale(0)}25%{opacity:1;transform:scale(1.6)}30%,84%{opacity:1;transform:scale(1)}92%,100%{opacity:0;transform:scale(0)}}
@keyframes t2{0%,31%{opacity:0;transform:scale(0)}36%{opacity:1;transform:scale(1.6)}41%,84%{opacity:1;transform:scale(1)}92%,100%{opacity:0;transform:scale(0)}}
@keyframes t3{0%,42%{opacity:0;transform:scale(0)}47%{opacity:1;transform:scale(1.8)}53%,84%{opacity:1;transform:scale(1)}92%,100%{opacity:0;transform:scale(0)}}
.tip-halo{fill:none;stroke:var(--gc);stroke-width:1.2;transform-box:fill-box;transform-origin:center;opacity:0;animation:tipHalo 6.5s infinite}
@keyframes tipHalo{0%,47%{opacity:0;transform:scale(.6)}56%{opacity:.7;transform:scale(2.4)}72%,100%{opacity:0;transform:scale(3.4)}}

/* Import: document drops into tray with speed lines & verification checkmark */
.doc{transform-box:fill-box;transform-origin:50% 100%;transform:translateY(34px);animation:drop2 5.8s 1s infinite}
.doc-fill{fill:var(--gc);fill-opacity:.12;stroke:none}
.speed-lines{stroke-dasharray:4 6;opacity:0;animation:speedLines 5.8s 1s infinite}
.tray{animation:tray 5.8s 1s infinite}
.tray-bar{stroke-width:3;stroke-dasharray:1;animation:trayBar 5.8s 1s infinite}
.tray-ok{stroke-width:2;stroke-dasharray:1;animation:trayBar 5.8s 1s infinite}
@keyframes drop2{
  0%{transform:translateY(-14px) scale(.94);opacity:0}
  10%{transform:translateY(0) scale(1);opacity:1;animation-timing-function:cubic-bezier(.55,0,.85,.5)}
  36%{transform:translateY(41px) scale(1.04,.94)}
  43%{transform:translateY(31px) scale(.98,1.02)}
  49%,84%{transform:translateY(34px) scale(1);opacity:1}
  94%,100%{transform:translateY(34px) scale(.96);opacity:0}
}
@keyframes speedLines{0%,10%{opacity:0}18%,34%{opacity:.45}40%,100%{opacity:0}}
@keyframes tray{0%,34%{stroke-opacity:.42}40%,62%{stroke-opacity:1}82%,100%{stroke-opacity:.42}}
@keyframes trayBar{0%,38%{stroke-dashoffset:1;opacity:0}52%,82%{stroke-dashoffset:0;opacity:1}92%,100%{stroke-dashoffset:1;opacity:0}}

/* Monitor: live telemetry waveform + glowing comet + dual sonar ping + scan bar */
.base{opacity:.25}
.scan-bar{stroke-width:.8;opacity:.22;animation:scanX 2.4s 1s linear infinite}
@keyframes scanX{0%{opacity:0;transform:translateX(0)}10%,90%{opacity:.22}100%{opacity:0;transform:translateX(104px)}}
.beat-glow{stroke-width:5;opacity:.3;filter:blur(3px);stroke-dasharray:.22 1;animation:travel 2.4s 1s linear infinite backwards}
.beat{stroke-width:2.2;stroke-dasharray:.22 1;animation:travel 2.4s 1s linear infinite backwards}
@keyframes travel{from{stroke-dashoffset:.22}to{stroke-dashoffset:-1}}
.ping{transform-box:fill-box;transform-origin:center;opacity:0;animation:ping 2.4s 1s ease-out infinite}
.ping2{transform-box:fill-box;transform-origin:center;opacity:0;animation:ping 2.4s 1.35s ease-out infinite}
@keyframes ping{0%,76%{opacity:0;transform:scale(1)}80%{opacity:.85}100%{opacity:0;transform:scale(4.5)}}

/* Security: shield draws, inner contour, check locks, laser scanner sweeps */
.shield-fill{fill:var(--gc);fill-opacity:.07;stroke:none}
.shield-inner{stroke-width:1;stroke-dasharray:3 5;opacity:.35}
.sweep{fill:var(--gc);stroke:none;opacity:.24;animation:sweep 3.8s 2s ease-in-out infinite}
.sweep-line{stroke:var(--gc);stroke-width:2;opacity:.75;animation:sweep 3.8s 2s ease-in-out infinite}
@keyframes sweep{0%{transform:translateY(0)}50%{transform:translateY(146px)}100%{transform:translateY(0)}}

svg.glyph{width:100%;height:100%;--gc:#2a63f0}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.beat,.beat-glow,.ping,.ping2,.sweep,.sweep-line,.radar-beam,.scan-bar,.lens-scan{display:none}}]]></style>
        <path class="sub-grid" d="M10 20h100M10 47h100M10 73h100M10 100h100"/>
        <path class="row-hi rh1" d="M14 34h52"/><path class="row-hi rh2" d="M14 60h52"/><path class="row-hi rh3" d="M14 86h52"/>
        <path class="row r1" d="M14 34h52"/><path class="row r2" d="M14 60h52"/><path class="row r3" d="M14 86h52"/>
        <path class="row-sub" d="M74 34h24M74 60h18M74 86h28"/>
        <g class="lens">
          <circle class="lens-ring" cx="76" cy="34" r="15"/>
          <circle class="d" pathLength="1" cx="76" cy="34" r="15"/>
          <line class="lens-scan" x1="65" y1="34" x2="87" y2="34"/>
          <circle class="dot" cx="76" cy="34" r="2.2"/>
          <path class="d l2" pathLength="1" d="M87 45l14 14"/>
        </g>
      </svg>