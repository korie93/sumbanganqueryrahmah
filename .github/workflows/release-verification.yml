name: Release Verification

permissions:
  actions: read
  contents: read

concurrency:
  group: release-verification-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_ENV: development
  PORT: 5000
  HOST: 127.0.0.1
  PUBLIC_APP_URL: http://127.0.0.1:5000
  CORS_ALLOWED_ORIGINS: http://127.0.0.1:5000
  SESSION_SECRET: sqr-ci-session-${{ github.run_id }}-${{ github.run_attempt }}-generate-per-run-secret-48chars
  PG_HOST: 127.0.0.1
  PG_PORT: 5432
  PG_USER: postgres
  PG_PASSWORD: sqr-ci-postgres-${{ github.run_id }}-${{ github.run_attempt }}-password-32chars
  PG_DATABASE: sqr_db
  SEED_DEFAULT_USERS: 1
  SEED_SUPERUSER_USERNAME: superuser${{ github.run_id }}${{ github.run_attempt }}
  SEED_SUPERUSER_PASSWORD: sqr-ci-superuser-${{ github.run_id }}-${{ github.run_attempt }}-password-32chars
  SEED_SUPERUSER_FULL_NAME: CI Superuser
  SMOKE_TEST_USERNAME: superuser${{ github.run_id }}${{ github.run_attempt }}
  SMOKE_TEST_PASSWORD: sqr-ci-superuser-${{ github.run_id }}-${{ github.run_attempt }}-password-32chars
  SMOKE_BASE_URL: http://127.0.0.1:5000
  PERF_COLLECTION_NICKNAME: Collector Alpha
  RELEASE_ARTIFACTS_DIR: artifacts/release-verification

on:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * *"

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Require main for production release dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Production release artifacts may only be created from main." >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Node version
        run: npm run verify:node-version

      - name: Verify repo hygiene
        run: npm run verify:repo-hygiene

      - name: Secret scan
        run: npm run verify:secrets

      - name: Audit dependencies
        run: npm run audit:dependencies

      - name: Verify XLSX vendor integrity
        run: npm run verify:xlsx-vendor-integrity

      - name: Generate SBOM
        run: SBOM_ARTIFACTS_DIR=artifacts/sbom npm run supply-chain:sbom

      - name: Start CI PostgreSQL
        run: bash scripts/ci-start-postgres.sh

      - name: Verify migration drift
        run: npm run db:check

      - name: Verify DB schema governance
        run: npm run verify:db-schema-governance

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Resolve system Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No system Chrome executable found on the runner." >&2
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Install Playwright Chromium dependencies
        run: npx playwright install-deps chromium

      - name: Run release readiness verification
        env:
          COLLECTION_PII_ENCRYPTION_KEY: sqr-release-ci-collection-pii-${{ github.run_id }}-${{ github.run_attempt }}-ephemeral-key-48chars
        run: npm run release:verify:local

      - name: Prepare immutable release candidate
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm run release:package
          ARCHIVE_NAME="sqr-release-${GITHUB_SHA}.tar.gz"
          tar -C artifacts/release/package -czf "artifacts/release/${ARCHIVE_NAME}" .
          (
            cd artifacts/release
            sha512sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha512"
          )

      - name: Upload immutable release candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            artifacts/release/sqr-release-${{ github.sha }}.tar.gz
            artifacts/release/sqr-release-${{ github.sha }}.tar.gz.sha512

      - name: Upload release verification artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-verification-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            artifacts/release-verification
            artifacts/sbom
            var/perf

  approve-production-release:
    if: github.event_name == 'workflow_dispatch'
    needs: release-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://sqr-system.com
    steps:
      - name: Download verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/approved-release

      - name: Verify approved archive checksum
        run: |
          cd artifacts/approved-release
          sha512sum -c "sqr-release-${GITHUB_SHA}.tar.gz.sha512"

      - name: Publish production-approved release
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: production-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            artifacts/approved-release/sqr-release-${{ github.sha }}.tar.gz
            artifacts/approved-release/sqr-release-${{ github.sha }}.tar.gz.sha512
